<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Purple background, rounded square -->
  <rect width="32" height="32" rx="7" fill="#5D0096"/>

  <!-- Left basket handle -->
  <line x1="11" y1="13.5" x2="9" y2="9" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Right basket handle -->
  <line x1="21" y1="13.5" x2="23" y2="9" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Basket body (white trapezoid) -->
  <path d="M5.5 13.5 H26.5 L24.5 22.5 Q24 24 22.5 24 H9.5 Q8 24 7.5 22.5 Z" fill="white" opacity="0.93"/>

  <!-- Basket center rib -->
  <line x1="6" y1="18.5" x2="26" y2="18.5" stroke="#5D0096" stroke-width="1.4" opacity="0.7"/>

  <!-- Top rim bar -->
  <line x1="4.5" y1="13.5" x2="27.5" y2="13.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Red-orange badge (top right) -->
  <circle cx="24.5" cy="8" r="4.5" fill="#D31710"/>
</svg>
